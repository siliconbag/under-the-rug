name: Linux X11 port

on:
  push:
    paths:
      - 'cross_platform/**'
      - 'Rug.spec'
      - '.github/workflows/linux-port.yml'
  pull_request:
    paths:
      - 'cross_platform/**'
      - 'Rug.spec'
      - '.github/workflows/linux-port.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install X11 and OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libgl1-mesa-dri libegl1 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r cross_platform/requirements.txt pyinstaller
      - name: Test cloth and OpenGL window
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_SESSION_TYPE: x11
        run: |
          .venv/bin/python -m unittest discover -s cross_platform -p 'test_*.py' -v
          xvfb-run -a -s '-screen 0 1280x800x24' .venv/bin/python cross_platform/smoke_gui.py
      - name: Build Linux archive
        run: |
          .venv/bin/python -m PyInstaller --noconfirm Rug.spec
          tar -C dist -czf Rug-Linux-x86_64.tar.gz Rug
      - uses: actions/upload-artifact@v4
        with:
          name: Rug-Linux-x86_64
          path: Rug-Linux-x86_64.tar.gz
